name: Manual Linux x86_64 binary

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release after all Linux gates pass (default: artifacts only)'
        type: boolean
        required: true
        default: false
      stable_release:
        description: 'Publish a stable release instead of a preview (requires confirmation)'
        type: boolean
        required: true
        default: false
      stable_confirmation:
        description: 'Stable release only: enter PUBLISH_STABLE to confirm'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: linux-manual-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux-x86_64:
    name: Verify and build Linux x86_64 executable
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Reject unconfirmed or inconsistent stable-release settings
        if: inputs.stable_release
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          STABLE_CONFIRMATION: ${{ inputs.stable_confirmation }}
        run: |
          if [[ "$PUBLISH_RELEASE" != 'true' || "$STABLE_CONFIRMATION" != 'PUBLISH_STABLE' ]]; then
            echo 'Stable release requires both Publish a GitHub Release and confirmation PUBLISH_STABLE.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Source and behavioral validation
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Compile and identify the actual ELF executable
        run: |
          set -euo pipefail
          cargo build --release --locked
          mkdir -p dist
          cp target/release/guvna dist/guvna-linux-x86_64
          chmod 755 dist/guvna-linux-x86_64
          test -x dist/guvna-linux-x86_64
          file dist/guvna-linux-x86_64 | tee dist/binary-info.txt
          readelf -h dist/guvna-linux-x86_64 | grep -E 'Class:|Machine:' | tee -a dist/binary-info.txt
          ./dist/guvna-linux-x86_64 --version | tee -a dist/binary-info.txt
          ldd dist/guvna-linux-x86_64 | tee -a dist/binary-info.txt
          printf 'commit: %s\n' "$(git rev-parse HEAD)" >> dist/binary-info.txt
          (cd dist && sha256sum guvna-linux-x86_64 > guvna-linux-x86_64.sha256)
          (cd dist && sha256sum -c guvna-linux-x86_64.sha256)
      - name: Run Linux release-binary adversarial gate
        run: |
          python3 scripts/quality_gate.py \
            --binary dist/guvna-linux-x86_64 \
            --requests 2000 --clients 64 --idle-seconds 10 \
            --max-idle-rss-mib 16 --max-peak-rss-mib 48 \
            --max-rss-growth-mib 6 \
            --out dist/quality-results.json
      - name: Publish executable, SHA256 and quality report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: guvna-linux-x86_64-${{ github.sha }}
          path: |
            dist/guvna-linux-x86_64
            dist/guvna-linux-x86_64.sha256
            dist/binary-info.txt
            dist/quality-results.json
          retention-days: 30
          if-no-files-found: error
      - name: Preserve quality report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guvna-linux-build-failure-${{ github.run_id }}
          path: dist/quality-results.json
          if-no-files-found: ignore

  publish-github-release:
    name: Publish manually selected GitHub Release
    needs: build-linux-x86_64
    if: github.ref == 'refs/heads/main' && inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the binary validated by this workflow run
        uses: actions/download-artifact@v4
        with:
          name: guvna-linux-x86_64-${{ github.sha }}
          path: dist
      - name: Verify exact commit, ELF architecture and SHA256
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/guvna-linux-x86_64
          test -s dist/guvna-linux-x86_64.sha256
          test -s dist/binary-info.txt
          test -s dist/quality-results.json
          file dist/guvna-linux-x86_64 | grep -Eq 'ELF 64-bit.*x86-64'
          readelf -h dist/guvna-linux-x86_64 | grep -Eq 'Machine:.*X86-64'
          grep -Fx "commit: $GITHUB_SHA" dist/binary-info.txt
          (cd dist && sha256sum -c guvna-linux-x86_64.sha256)
      - name: Set unique preview tag or exact Cargo stable tag
        id: release
        shell: bash
        env:
          STABLE_RELEASE: ${{ inputs.stable_release }}
          STABLE_CONFIRMATION: ${{ inputs.stable_confirmation }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A stable SemVer package version is required: $version" >&2
            exit 1
          fi
          if [[ "$STABLE_RELEASE" == 'true' ]]; then
            if [[ "$STABLE_CONFIRMATION" != 'PUBLISH_STABLE' ]]; then
              echo 'Explicit stable confirmation is required.' >&2
              exit 1
            fi
            tag="v$version"
            title="guvna $version - Linux x86_64"
            kind=stable
          else
            tag="v$version-preview.$GITHUB_RUN_ID"
            title="guvna $version preview ($GITHUB_RUN_ID) - Linux x86_64"
            kind=preview
          fi
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "Release tag already exists; refusing to overwrite $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          {
            echo "Manually triggered $kind release of guvna-rs."
            echo
            echo "- Source: main at \`$GITHUB_SHA\`"
            echo "- Platform: Linux x86_64 (built on Ubuntu 24.04)"
            echo "- Includes: executable, SHA256, binary metadata and resource-gate report"
            echo "- Validation: fmt, Clippy -D warnings, full tests, release build and adversarial resource gate"
            echo "- Older glibc compatibility is not guaranteed."
            echo "- No automatic deployment or production service replacement."
          } > release-notes.md
      - name: Publish GitHub Release (manual-only, never overwrite)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          KIND: ${{ steps.release.outputs.kind }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$KIND" == 'preview' ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            dist/guvna-linux-x86_64 \
            dist/guvna-linux-x86_64.sha256 \
            dist/binary-info.txt \
            dist/quality-results.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            "${flags[@]}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
