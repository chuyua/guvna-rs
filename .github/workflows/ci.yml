name: Rust CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: target/release/guvna --version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned official SDKs for local mock acceptance
        run: |
          python3 -m venv .ci-sdk-python
          .ci-sdk-python/bin/pip install openai==3.42.0
          npm --prefix .ci-sdk-node install openai@7.47.0 --ignore-scripts --no-fund --no-audit
      - name: Official Python and Node SDK HTTP roundtrips
        env:
          GUVNA_SDK_PYTHON: ${{ github.workspace }}/.ci-sdk-python/bin/python
          GUVNA_SDK_NODE_PACKAGE: ${{ github.workspace }}/.ci-sdk-node/node_modules/openai
        run: cargo test --locked --test responses_protocol official_python_and_node_sdk_roundtrips -- --ignored --nocapture
      - name: Record exact tested source
        if: always()
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          Path('tested-source.json').write_text(json.dumps({
              'checkout': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'pr_head': os.environ['PR_HEAD'], 'pr_base': os.environ['PR_BASE']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guvna-protocol-sdk-acceptance
          path: |
            sdk-results.json
            tested-source.json

  adversarial-resource-gate:
    name: Adversarial Linux resource gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Enforce idle RSS, CPU, leak and local chaos pressure gates
        run: python3 scripts/quality_gate.py --binary target/release/guvna --requests 2000 --clients 64 --idle-seconds 10 --max-idle-rss-mib 16 --max-peak-rss-mib 48 --max-rss-growth-mib 6 --out quality-results.json
      - name: Upload full quality results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guvna-linux-resource-gate
          path: quality-results.json
          if-no-files-found: warn
